name: RQ2 A2 Consumer

on:
  workflow_run:
    workflows: ["RQ2 A2 Producer"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  consume:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download producer artifact without content validation
        uses: actions/download-artifact@v4
        with:
          name: rq2-marker-payload
          path: rq2-marker-payload
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Execute artifact-controlled marker payload
        env:
          GH_TOKEN: ${{ github.token }}
          RQ2_FAMILY: A2
          RQ2_MARKER: a2-${{ github.event.workflow_run.id }}-${{ github.run_id }}
          GITHUB_DEFAULT_BRANCH: main
        run: bash rq2-marker-payload/rq2-artifact-payload.sh
